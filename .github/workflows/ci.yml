name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate skills and marketplace
        run: python3 scripts/validate_skills.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests of every skill
        run: |
          set -e
          for t in skills/*/*/scripts/test_*.py; do
            echo "→ $t"
            python3 -m unittest "$t"
          done
